# Tests, lint and build. Runs on pull requests and on pushes to branches other than main;
# deploy.yml calls it before every deployment, so main is never deployed untested.
name: CI

on:
  pull_request:
  push:
    branches-ignore: ['main']
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Lint must be clean: any problem fails the job. (The count-vs-baseline gate below is kept so a
      # known problem could be tolerated temporarily by raising this number; leave it at 0.)
      LINT_BASELINE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Vitest 5 needs Node 22.12 or newer.
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint (must report no problems)
        run: |
          npx eslint . -f json -o eslint-report.json || true
          node -e '
            const report = require("./eslint-report.json");
            const count = report.reduce((n, file) => n + file.messages.length, 0);
            const baseline = Number(process.env.LINT_BASELINE);
            console.log(`ESLint: ${count} problem(s), baseline ${baseline}`);
            if (count > baseline) {
              for (const file of report) {
                for (const m of file.messages) console.log(`${file.filePath}:${m.line} ${m.ruleId} ${m.message.split("\n")[0]}`);
              }
              console.log(`::error::ESLint found ${count} problems, more than the baseline of ${baseline}`);
              process.exit(1);
            }
          '
      - name: Build
        run: npm run build
